name: build-vsix-merge

# 合入 master 时的打包入口：仅在 package.json 变更时触发打包；手动触发不受限。
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'package.json'

env:
  HUSKY: 0

jobs:
  build_vsix:
    name: Build VSIX
    runs-on: [self-hosted, arch=x64, spec=small]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
    steps:
      - name: Checkout
        uses: checkout

      - name: Install git-lfs
        run: |
          if ! git lfs version; then
            (sudo apt-get update -y && sudo apt-get install -y git-lfs) || (apt-get update -y && apt-get install -y git-lfs)
          fi
          git lfs install --skip-repo
          git lfs version

      - name: Pull LFS objects
        run: |
          git lfs pull

      - name: Setup Node.js
        uses: setup-node
        with:
          node-version: "22"

      - name: Install root dependencies
        run: npm ci

      - name: Install webview dependencies
        run: cd media/vue-project && npm ci

      - name: Install vsce
        run: npm install -g @vscode/vsce --ignore-scripts

      - name: Package vsix
        run: |
          VERSION=$(node -p "require('./package.json').version")
          STAMP=$(TZ=Asia/Shanghai date +%Y%m%d%H%M%S)
          vsce package --out "pypto-toolkit-${VERSION}-${STAMP}.vsix"

      - name: Upload artifact
        uses: upload-artifact
        with:
          name: pypto-toolkit-${{ atomgit.ref_name }}
          path: '*.vsix'
          retention-days: 7
